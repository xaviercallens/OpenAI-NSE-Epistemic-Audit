name: Verification Pipeline (tests + Lean)

# Python tests on every push/PR. The Lean check needs OpenAI's NavierStokesAndEuler project and the
# Mathlib cache (several GB), so it runs on manual dispatch only. Full numeric reproduction:
# scripts/run_benchmarks.sh (see BENCHMARKS.md).

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy scipy sympy mpmath matplotlib pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Structural scan of OpenAI's Lean source (writes openai_lean_audit_certificate.json)
        run: python scripts/extract_openai_lean.py

  lean-verified-files:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: audit

      - name: Checkout OpenAI NavierStokesAndEuler
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          path: NavierStokesAndEuler

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache and build the three needed OpenAI modules
        working-directory: NavierStokesAndEuler
        run: |
          lake exe cache get
          lake build NavierStokes.PeriodicUniqueness

      - name: Check the nine verified files (no errors, no sorry, standard axioms only)
        working-directory: NavierStokesAndEuler
        run: |
          set -e
          for f in CoreScaling LerayAlphaFilter LatticeBGKEntropy AlphaEnergyIdentity NonlinearBGKEntropy \
                   KineticSpectralCap OpenAIAdmissibility BlowupRegimeMap LerayAlphaLinearization; do
            out=$(lake env lean "../audit/03_Lean4_Topological_Censorship/src/$f.lean" 2>&1)
            echo "$out" | tr '\n' ' ' | grep -q "error" && { echo "$out"; exit 1; }
            echo "$out" | grep -q "sorryAx" && { echo "$f uses sorry"; exit 1; }
            echo "$out" | tr '\n' ' ' | sed 's/ \+/ /g' | grep -o "depends on axioms: \[[^]]*\]" | grep -v "\[propext, Classical.choice, Quot.sound\]" && { echo "$f: non-standard axioms"; exit 1; }
            echo "$f OK"
          done
